# Values to merge into the bot's live robot.conf. Only the keys listed here are
# touched; everything else in the file is left alone. Apply with
#   tools/push_conf.sh          (or the "push config" task)
#   tools/push_conf.sh --dry    to see the diff without changing anything
#
# 2026-10-10 21:00 -- outer loop off the stability edge, half the velocity gain
# at the same spring/damper ratio and the same spring cap; velocity from the
# RoboClaw registers (the least-squares switch at 6089 preceded a fall);
# no damping filter. Inner loop as it was.

[pitch_duty]
kp = 0.20
ki = 0.035
kd = 0.014

[yaw_duty]
kp = 0.02
ki = 0
kd = 0

[position]
vel_src = 0
vel_damp_fc = 0
vel_scale_stop = 7.4
scale_d = 180
lead_max = 120
yield_ms = 300
yield_err_ticks = 120
yield_damp_gain = 0.25
hold_after_oob_ms = 500

[motor]
mode = 0
qpps_max = 1000
max_amps = 5
friction_ff = 0.05
# RoboClaw main-battery max. The controller's own was 0 after a config reset,
# so the bus was permanently 'over max' and regen braking was clamped: every
# large command against wheel motion freewheeled at ~0.1 A (every fall 10-07..10-10).
# 16 V gives a 3S pack headroom for regen spikes. Never leave this at 0.
min_batt_v = 9
max_batt_v = 16

[system]
oob_angle_deg = 12.5
reengage_deg = 6
reengage_rate = 30
